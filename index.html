<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f3f2ec" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>墨兰写作</title>
    <meta name="color-scheme" content="light" />
    <script>
      (function () {
        var c = "system";
        try { c = localStorage.getItem("molan.theme") || "system"; } catch (e) {}
        var ok = { system: 1, light: 1, dark: 1, paper: 1, green: 1, molan: 1, ash: 1, mist: 1, sakura: 1, night: 1, contrast: 1, ancient: 1 };
        var dk = { dark: 1, night: 1, contrast: 1, ancient: 1 };
        if (!ok[c]) c = "system";
        var r = c === "system" ? (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : c;
        var tc = { light: "#f3f2ec", dark: "#171b20", paper: "#efe3c8", green: "#dbe7d4", molan: "#ececf4", ash: "#e8e8e6", mist: "#dde8e8", sakura: "#f2e4e6", night: "#141b26", contrast: "#000000", ancient: "#2a2119" };
        var d = document.documentElement;
        d.setAttribute("data-theme", r);
        d.setAttribute("data-theme-choice", c);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", tc[r]);
        var cs = document.querySelector('meta[name="color-scheme"]');
        if (cs) cs.setAttribute("content", dk[r] ? "dark" : "light");
        d.style.colorScheme = dk[r] ? "dark" : "light";
        var f = "default", z = "md";
        try { f = localStorage.getItem("molan.font") || f; z = localStorage.getItem("molan.fontSize") || z; } catch (e) {}
        if (!{ default: 1, song: 1, hei: 1, kai: 1, fangsong: 1, wenkai: 1, system: 1 }[f]) f = "default";
        if (!{ xs: 1, sm: 1, md: 1, lg: 1, xl: 1, xxl: 1 }[z]) z = "md";
        d.setAttribute("data-font", f);
        d.setAttribute("data-fs", z);
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Single active font stylesheet to avoid duplicate unicode-range faces.
         Prefer China-friendly mirror; fall back to Google Fonts if mirror fails. -->
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin />
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="cj-fonts"
      rel="stylesheet"
      href="https://fonts.loli.net/css2?family=Inter:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400;500;600;700&amp;display=swap"
    />
    <script>
      (function () {
        var link = document.getElementById("cj-fonts");
        if (!link) return;
        var fallback =
          "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&display=swap";
        var done = false;
        function useFallback() {
          if (done) return;
          done = true;
          link.href = fallback;
        }
        link.addEventListener("error", useFallback);
        // If mirror returns empty/opaque CSS, switch after a short probe.
        fetch(link.href, { mode: "cors" })
          .then(function (r) {
            return r.text().then(function (t) {
              if (!r.ok || !t || t.length < 80) useFallback();
            });
          })
          .catch(useFallback);
      })();
    </script>
    <script defer src="https://cdn.eazo.ai/branding/eazo-brand-banner.js" data-eazo-app-id="iylCsXBRrJj5v23U"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/main.tsx"></script>
  </body>
</html>
